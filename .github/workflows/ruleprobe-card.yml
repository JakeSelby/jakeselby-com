name: ruleprobe card

# Checks the ruleprobe card against the latest ruleprobe release every six hours and on demand
# after a deploy: copy reviewed for that release, that copy live, both placements resolving and
# linking the reference site. scripts/ruleprobe-card-check.mjs keeps one `release-drift` issue,
# titled for this card alone, open until all of that holds and closes it after. Nothing here deploys.

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ruleprobe-card
  cancel-in-progress: false

jobs:
  card:
    name: check the card against the latest release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/ruleprobe-card-check.mjs
