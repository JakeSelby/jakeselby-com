name: build

# Every push and pull request must produce a complete static site from the committed tree
# alone. This is the check that would have caught main depending on uncommitted edits.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assert the artifact is a complete site
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/resume/index.html
          pages=$(find dist -name index.html | wc -l)
          echo "pages: $pages"
          test "$pages" -ge 3
